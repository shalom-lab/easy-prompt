<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Easy Prompt Promo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px;
            background: #f5f5f5;
        }
        
        /* 小型宣传图 440x280 */
        .small-promo {
            width: 440px; /* 严格符合要求尺寸 */
            height: 280px;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 大型宣传图 1400x560 */
        .large-promo {
            width: 1400px; /* 严格符合要求尺寸 */
            height: 560px;
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .icon-container {
            margin-bottom: 20px;
        }
        
        .icon {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }
        
        .large-promo .icon {
            width: 96px;
            height: 96px;
            margin-bottom: 10px;
        }
        
        .text-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2.2em;
            margin: 0 0 15px 0;
            font-weight: 700;
        }
        
        .large-promo h1 {
            font-size: 3.5em;
            margin: 0 0 20px 0;
        }
        
        .tagline {
            font-size: 1.1em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .large-promo .tagline {
            font-size: 1.6em;
            margin-bottom: 40px;
        }
        
        .features {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px auto;
            max-width: 1000px;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            flex: 1;
            min-width: 200px;
        }
        
        .feature h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
        }
        
        .feature p {
            margin: 0;
            opacity: 0.9;
        }
        
        .decoration {
            position: absolute;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        .dec1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }
        
        .dec2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            opacity: 0.5;
        }
        
        .platforms {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .platform {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .small-promo .platforms {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <!-- 小型宣传图 -->
    <div class="small-promo">
        <div class="content">
            <div class="icon-container">
                <img src="icon.svg" alt="Easy Prompt" class="icon">
            </div>
            <div class="text-content">
                <h1>Easy Prompt</h1>
                <div class="tagline">Your AI Prompt Assistant</div>
                <div class="platforms">
                    <span class="platform">ChatGPT</span>
                    <span class="platform">Claude</span>
                    <span class="platform">Gemini</span>
                </div>
            </div>
        </div>
        <div class="decoration dec1"></div>
        <div class="decoration dec2"></div>
    </div>
    
    <br><br>
    
    <!-- 大型宣传图 -->
    <div class="large-promo">
        <div class="content">
            <div class="icon-container">
                <img src="icon.svg" alt="Easy Prompt" class="icon">
            </div>
            <div class="text-content">
                <h1>Easy Prompt</h1>
                <div class="tagline">Streamline Your AI Workflow</div>
                <div class="features">
                    <div class="feature">
                        <h3>🚀 Multi-Platform</h3>
                        <p>Works with all major AI platforms</p>
                    </div>
                    <div class="feature">
                        <h3>💾 Quick Save</h3>
                        <p>One-click prompt management</p>
                    </div>
                    <div class="feature">
                        <h3>🔒 Privacy First</h3>
                        <p>All data stored locally</p>
                    </div>
                </div>
                <div class="platforms">
                    <span class="platform">ChatGPT</span>
                    <span class="platform">Claude</span>
                    <span class="platform">Gemini</span>
                    <span class="platform">DALL·E</span>
                    <span class="platform">Midjourney</span>
                </div>
            </div>
        </div>
        <div class="decoration dec1"></div>
        <div class="decoration dec2"></div>
    </div>
</body>
</html>
