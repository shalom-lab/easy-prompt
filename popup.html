<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Saver</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="app">
    <div class="header-container">
      <div class="title-row">
        <h1>Easy Prompt</h1>
        <a href="https://github.com/shalom-lab/easy-prompt" target="_blank" class="github-star">⭐</a>
      </div>
      <div class="import-export">
        <input type="file" id="import-file" accept=".json" style="display: none;">
        <a href="https://shalom-lab.github.io/awesome-prompt/" target="_blank" class="btn-secondary btn-market">Market</a>
        <button id="import-btn" class="btn-secondary">Import</button>
        <button id="export-btn" class="btn-secondary">Export</button>
      </div>
    </div>
    
    <div class="input-container">
      <textarea id="new-prompt" placeholder="Enter your prompt here... (Ctrl+V to paste, Ctrl+Enter to save)"></textarea>
    </div>

    <div class="button-group">
      <button id="add-btn">Add</button>
    </div>
    
    <ul id="prompt-list"></ul>
  </div>
  <script src="popup.js"></script>
</body>

</html>
