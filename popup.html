<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Saver</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="app">
    <div class="header-container">
      <h1>Prompt Saver</h1>
      <div class="import-export">
        <input type="file" id="import-file" accept=".json" style="display: none;">
        <button id="import-btn" class="btn-secondary">Import</button>
        <button id="export-btn" class="btn-secondary">Export</button>
      </div>
    </div>
    
    <div class="input-container">
      <textarea id="new-prompt" placeholder="Enter your prompt here... (Ctrl+Enter to save, Ctrl+Shift+V to paste and save)"></textarea>
    </div>

    <div class="button-group">
      <button id="add-btn">Add</button>
    </div>
    
    <ul id="prompt-list"></ul>
  </div>
  <script src="popup.js"></script>
</body>

</html>
